<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturador de Frame para Base64 (&lt; 50KB)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #22c55e;
            --success-hover: #16a34a;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        input[type="url"], input[type="file"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #fff;
            margin-top: 10px;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .video-container {
            margin-top: 20px;
            text-align: center;
        }

        video {
            width: 100%;
            max-height: 400px;
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .controls input[type="range"] {
            flex: 1;
        }

        .output-container {
            margin-top: 25px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .meta-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }

        .preview-img {
            margin-top: 15px;
            max-width: 200px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: block;
        }

        .note {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            font-size: 0.85rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Extrator de Frame para Base64 (&lt; 50KB)</h1>
    <p class="subtitle">Capture frames otimizados automaticamente para menos de 50KB em formato JPEG.</p>

    <div class="note">
        <strong>Aviso de CORS:</strong> Para links externos, o servidor de origem precisa permitir o acesso CORS. Caso contrário, carregue o vídeo do seu computador.
    </div>

    <div class="input-group">
        <label for="videoUrl">Link Direto do Vídeo (URL)</label>
        <div class="row">
            <input type="url" id="videoUrl" placeholder="https://exemplo.com/video.mp4">
            <button id="loadUrlBtn">Carregar Link</button>
        </div>
    </div>

    <div class="input-group">
        <label for="videoFile">Ou Enviar Vídeo do Computador</label>
        <input type="file" id="videoFile" accept="video/*">
    </div>

    <div class="video-container">
        <video id="videoPlayer" controls crossorigin="anonymous"></video>
        
        <div class="controls">
            <span id="currentTimeDisplay" style="font-size: 0.85rem; font-family: monospace;">00:00</span>
            <input type="range" id="timeSlider" value="0" min="0" max="100" step="0.1">
            <button id="captureBtn">Capturar Frame</button>
        </div>
    </div>

    <div class="output-container" id="outputSection" style="display: none;">
        <div id="sizeInfo" class="meta-info"></div>
        <label for="base64Output">Resultado em Base64</label>
        <textarea id="base64Output" readonly></textarea>
        <button class="btn-success" id="copyBtn">Copiar Código Base64</button>
        
        <label style="margin-top: 20px;">Pré-visualização da Imagem Gerada</label>
        <img id="previewImg" class="preview-img" alt="Preview do Frame">
    </div>
</div>

<script>
    const videoUrlInput = document.getElementById('videoUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const videoFileInput = document.getElementById('videoFile');
    const videoPlayer = document.getElementById('videoPlayer');
    const timeSlider = document.getElementById('timeSlider');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const captureBtn = document.getElementById('captureBtn');
    const outputSection = document.getElementById('outputSection');
    const base64Output = document.getElementById('base64Output');
    const sizeInfo = document.getElementById('sizeInfo');
    const copyBtn = document.getElementById('copyBtn');
    const previewImg = document.getElementById('previewImg');

    loadUrlBtn.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        if (url) {
            videoPlayer.src = url;
            videoPlayer.load();
        }
    });

    videoFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const fileURL = URL.createObjectURL(file);
            videoPlayer.src = fileURL;
            videoPlayer.load();
        }
    });

    videoPlayer.addEventListener('loadedmetadata', () => {
        timeSlider.max = videoPlayer.duration;
        timeSlider.value = 0;
        currentTimeDisplay.textContent = formatTime(0);
    });

    videoPlayer.addEventListener('timeupdate', () => {
        if (!isDragging) {
            timeSlider.value = videoPlayer.currentTime;
            currentTimeDisplay.textContent = formatTime(videoPlayer.currentTime);
        }
    });

    let isDragging = false;
    timeSlider.addEventListener('input', () => {
        isDragging = true;
        videoPlayer.currentTime = timeSlider.value;
        currentTimeDisplay.textContent = formatTime(videoPlayer.currentTime);
    });

    timeSlider.addEventListener('change', () => {
        isDragging = false;
    });

    captureBtn.addEventListener('click', () => {
        if (!videoPlayer.duration) {
            alert('Por favor, carregue um vídeo primeiro.');
            return;
        }

        // Se o vídeo for muito grande em resolução, redimensionamos proporcionalmente
        // para ajudar a encaixar na meta de 50KB sem perder muita nitidez.
        let width = videoPlayer.videoWidth;
        let height = videoPlayer.videoHeight;
        const maxDimension = 720; // Limite máximo inicial de largura/altura

        if (width > maxDimension || height > maxDimension) {
            if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
            } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
            }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoPlayer, 0, 0, width, height);

        try {
            // Algoritmo para ajustar a qualidade JPEG iterativamente até ficar abaixo de 50KB (51200 bytes)
            let quality = 0.9;
            let base64String = canvas.toDataURL('image/jpeg', quality);
            let sizeInBytes = getBase64Size(base64String);

            // Reduz qualidade gradualmente se passar de 50KB
            while (sizeInBytes > 51200 && quality > 0.1) {
                quality -= 0.1;
                base64String = canvas.toDataURL('image/jpeg', quality);
                sizeInBytes = getBase64Size(base64String);
            }

            const sizeInKb = (sizeInBytes / 1024).toFixed(2);

            base64Output.value = base64String;
            previewImg.src = base64String;
            sizeInfo.textContent = `Tamanho final: ${sizeInKb} KB (Qualidade JPEG: ${Math.round(quality * 100)}%)`;
            outputSection.style.display = 'block';
        } catch (error) {
            alert('Erro ao capturar o frame. Verifique restrições de CORS.');
            console.error(error);
        }
    });

    // Função auxiliar para calcular o tamanho real em bytes da string Base64
    function getBase64Size(base64String) {
        const base64WithoutHeader = base64String.split(',')[1] || base64String;
        const padding = (base64WithoutHeader.endsWith('==') ? 2 : (base64WithoutHeader.endsWith('=') ? 1 : 0));
        return (base64WithoutHeader.length * 3) / 4 - padding;
    }

    // Botão de copiar
    copyBtn.addEventListener('click', () => {
        base64Output.select();
        navigator.clipboard.writeText(base64Output.value).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copiado com sucesso!';
            copyBtn.style.backgroundColor = '#0f766e';
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.backgroundColor = '';
            }, 2000);
        }).catch(err => {
            alert('Erro ao copiar texto.');
            console.error(err);
        });
    });

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
</script>

</body>
</html>
